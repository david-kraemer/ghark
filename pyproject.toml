[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghark"
version = "0.1.0"
description = "Session-scoped GitHub pull request activity notifications over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  # MCP 1.30.0 imports rich.pretty.data, which Rich does not provide.
  "mcp[cli]>=1.29,<1.30",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[project.scripts]
ghark = "ghark.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ghark"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
